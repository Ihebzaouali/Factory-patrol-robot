# Camera Configuration for camera_0
# RGB Camera for person detection

camera_0:
  ros__parameters:
    # Camera settings
    frame_id: "camera_0_optical_link"
    update_rate: 30.0
    
    # Image properties
    width: 640
    height: 480
    fov: 1.047  # Field of view in radians (60 degrees)
    
    # Camera info
    camera_name: "camera_0"
    
    # Image encoding
    encoding: "rgb8"
