[metadata]
name=rallp_config
version = attr: rallp_config.__version__
author = Mohamed Ali Zouari
author_email = mohamedalizouari.ai@mail.ru
description = Rallp Configuration Parser

[options]
install_requires =
    requests
    importlib-metadata; python_version < "3.8"
packages =
    rallp_config
    rallp_config.platform
    rallp_config.system
    rallp_config.mounts
    rallp_config.sensors

[develop]
script_dir=$base/lib/rallp_config

[install]
install_scripts=$base/lib/rallp_config
